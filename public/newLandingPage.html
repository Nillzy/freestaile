<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FreestAIle - AI Powered PowerPoint Karaoke</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #db2777 100%);
            overflow-x: hidden;
        }
        .ai-text-gradient {
            background: linear-gradient(90deg, #ec4899, #f59e0b, #ec4899);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient-animation 3s ease infinite;
            display: inline-block;}
        .ai-float {
            animation: float-animation 3s ease-in-out infinite;
            display: inline-block;}
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float-animation {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }}
        .card {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .btn-primary {
            background-color: #ec4899;transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #db2777;}
        .btn-secondary {
            background-color: #8b5cf6;transition: background-color 0.3s ease;
        }
        .btn-secondary:hover {
            background-color: #7c3aed;}
        .input-field {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .input-field:focus {
            background-color: rgba(255, 255, 255, 0.3);
            border-color: #ec4899;
            box-shadow: 0 0 0 2px rgba(236, 72, 153, 0.5);
        }
        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1.5em 1.5em;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            padding-right: 2.5rem;}
        .logo-container {
            position: relative;
        }.language-selector {
             position: absolute;
             top: 1.5rem;
             right: 1.5rem;
         }
        /* Für SVG stroke Farben mit Tailwind */
        .stroke-current { stroke: currentColor; }
        .stroke-pink-300 { stroke: #f9a8d4; /* Entspricht Tailwind pink-300 */ }

    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-white p-4 selection:bg-pink-500 selection:text-white">
<div class="language-selector">
    <button class="flex items-center space-x-1 p-2 bg-white/10 backdrop-blur-sm rounded-lg hover:bg-white/20 transition-colors">
        <span class="material-icons text-xl">language</span>
        <span class="text-sm font-medium">EN</span>
    </button>
</div>
<header class="text-center mb-12">
    <h1 class="text-5xl md:text-7xl font-bold logo-container">
        Freest<span class="ai-text-gradient ai-float">AI</span>le
    </h1>
    <p class="text-xl md:text-2xl mt-4 text-pink-200">The AI-Powered PowerPoint Karaoke Game</p>
</header>
<main class="w-full max-w-4xl grid md:grid-cols-2 gap-8">
    <section class="card">
        <h2 class="text-3xl font-semibold mb-6 text-center text-pink-300">QUICKmode</h2>
        <form class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-pink-100 mb-1" for="topic">Enter a Topic</label>
                <input class="w-full px-4 py-3 rounded-lg input-field text-white placeholder-gray-300 focus:outline-none" id="topic" name="topic" placeholder="e.g., 'The Future of Cats'" type="text"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-pink-100 mb-1" for="language">Choose Language</label>
                <select class="w-full px-4 py-3 rounded-lg input-field text-white focus:outline-none" id="language" name="language">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="it">Italiano</option>
                </select>
            </div>
            <button class="w-full btn-primary text-white font-semibold py-3 px-6 rounded-lg text-lg flex items-center justify-center space-x-2" type="submit">
                <span class="material-icons">bolt</span>
                <span>Start Generating!</span>
            </button>
        </form>
    </section>
    <section class="card flex flex-col items-center justify-center">
        <h2 class="text-3xl font-semibold mb-6 text-center text-violet-300">MULTIPLAYERmode</h2>
        <div class="text-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-20 h-20 text-violet-400 mb-4" fill="currentColor">
                <!-- Leinwand -->
                <rect x="50" y="10" width="45" height="60" rx="3" ry="3"/>

                <!-- Präsentator -->
                <circle cx="30" cy="30" r="8"/> <!-- Kopf -->
                <rect x="26" y="38" width="8" height="32" rx="2"/> <!-- Körper -->
                <!-- Einfacher zeigender Arm als Linie -->
                <line x1="34" y1="45" x2="48" y2="35" stroke-width="4" stroke-linecap="round" class="stroke-current"/>

                <!-- Publikum (vereinfacht) -->
                <!-- Person 1 -->
                <circle cx="30" cy="85" r="7"/>
                <rect x="24" y="92" width="12" height="8" rx="3"/>

                <!-- Person 2 -->
                <circle cx="50" cy="85" r="7"/>
                <rect x="44" y="92" width="12" height="8" rx="3"/>

                <!-- Person 3 -->
                <circle cx="70" cy="85" r="7"/>
                <rect x="64" y="92" width="12" height="8" rx="3"/>
            </svg>
            <p class="text-lg mb-6 text-violet-100">Ready to improvise with friends?</p>
        </div>
        <button class="w-full btn-secondary text-white font-semibold py-3 px-6 rounded-lg text-lg flex items-center justify-center space-x-2">
            <span class="material-icons">people</span>
            <span>Play Together!</span>
        </button>
    </section>
</main>
<footer class="mt-12 text-center text-sm text-pink-200">
    <p>© 2024 FreestAIle. Unleash your creativity!</p>
</footer>
</body></html>
